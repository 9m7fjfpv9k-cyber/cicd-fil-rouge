# Publie les 5 images TaskFlow utilisées en J2 et J3 (M2).
# À lancer à la main : onglet Actions → « Publier les images TaskFlow » → Run workflow.
name: Publier les images TaskFlow

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: taskflow:${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: "1.0.0"
            failure_rate: "0"
            latency_ms: "0"
          - tag: "1.1.0"
            failure_rate: "0"
            latency_ms: "0"
          - tag: "2.0.0"
            failure_rate: "0"
            latency_ms: "0"
          # Version piégée pour le J3 : /health répond, mais 30 % des requêtes
          # échouent et chaque réponse prend 300 ms de plus.
          - tag: "2.1.0"
            failure_rate: "0.3"
            latency_ms: "300"
          # Correctif publié au J3 : version saine qui succède à la 2.1.0.
          - tag: "2.2.0"
            failure_rate: "0"
            latency_ms: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/taskflow:${{ matrix.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ matrix.tag }}
            FAILURE_RATE=${{ matrix.failure_rate }}
            LATENCY_MS=${{ matrix.latency_ms }}
